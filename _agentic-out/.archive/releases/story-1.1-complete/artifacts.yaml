workflow_gates:
  before_create_story:
    required:
      - prd
      - architecture
      - epics
    conditionally_required:
      - ux # required when the product has a user-facing UI; may be waived (record a waiver) for backend-only projects
    recommended:
      - readiness
      - test_design
  before_develop_story:
    required:
      - story
    recommended:
      - readiness
      - test_design
  before_done:
    required:
      - automation
    recommended:
      - traceability

# Profile-specific gates. The standard matrix intentionally matches
# workflow_gates above so old schema-v2 projects retain their behavior.
delivery_profile_gates:
  quick:
    before_create_story:
      required: [implementation_spec]
      recommended: [architecture]
    before_develop_story:
      required: [work_item]
      recommended: [test_design]
    before_done:
      required: [automation, code_review]
      recommended: [traceability]
  standard:
    before_create_story:
      required: [prd, architecture, epics]
      conditionally_required: [ux]
      recommended: [readiness, test_design]
    before_develop_story:
      required: [story]
      recommended: [readiness, test_design]
    before_done:
      required: [automation]
      recommended: [traceability]
  assured:
    before_create_story:
      required: [prd, architecture, epics, readiness, test_design]
      conditionally_required: [ux]
      recommended: []
    before_develop_story:
      required: [story, readiness, test_design, project_governance]
      recommended: []
    before_done:
      required: [automation, traceability, nfr, code_review]
      recommended: []

